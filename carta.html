<!doctype html>
<html lang="es" class="is-closed">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#110a22">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
  <title>Para vos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=7">
  <link rel="stylesheet" href="css/carta.css?v=7">
  <script src="js/config.js?v=7" defer></script>
  <script src="js/fondo.js?v=7" defer></script>
  <script src="js/mono.js?v=7" defer></script>
  <script src="js/carta.js?v=7" defer></script>
</head>
<body>
  <div class="sparkles" aria-hidden="true"></div>

  <main class="stage">
    <div class="scroll" id="scroll">
      <div class="sheet" id="sheet">
        <canvas class="sheet__paper" aria-hidden="true"></canvas>
        <article class="letter"></article>
      </div>

      <div class="roll" aria-hidden="true"><canvas class="roll__paper"></canvas><span class="roll__lines"></span></div>
      <div class="ribbon" aria-hidden="true"></div>

      <button type="button" class="bow" id="bow" aria-label="Desatar el moño y abrir la carta">
        <canvas class="bow__canvas" aria-hidden="true"></canvas>
      </button>

      <p class="tap-hint" aria-hidden="true">Tocá el moño</p>
      <p class="close-hint" aria-hidden="true">Tocá el rollo para cerrarla</p>
    </div>
  </main>

</body>
</html>
