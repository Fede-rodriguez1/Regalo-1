<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#110a22">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
  <title>Un regalo para vos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=7">
  <link rel="stylesheet" href="css/login.css?v=7">
  <link rel="prefetch" href="carta.html">
  <script src="js/config.js?v=7" defer></script>
  <script src="js/fondo.js?v=7" defer></script>
  <script src="js/vela-espiral.js?v=7" defer></script>
  <script src="js/login.js?v=7" defer></script>
</head>
<body>
  <div class="sparkles" aria-hidden="true"></div>

  <main class="login">
    <!-- Con la vela prendida la página queda a oscuras y solo la ilumina la llama -->
    <div class="penumbra" aria-hidden="true"></div>

    <!-- Vela 3D (js/vela-espiral.js): se prende sola al entrar, se gira arrastrando y se sopla tocándola -->
    <div class="vela">
      <vela-espiral controls="false" wheel-zoom="false" zoom="5.6" target-y="0.1"></vela-espiral>
      <div class="deseos" role="status">
        <p class="deseos__titulo"></p>
        <p class="deseos__texto"></p>
        <span class="deseos__estrellas" aria-hidden="true"><i>✦</i><i>✦</i><i>✦</i></span>
      </div>
    </div>

    <h1 class="login__title">Hola Vale<br><em>Feliz cumple</em></h1>
    <p class="login__sub">Aqui el regalo prometido<br>Solo tenés que adivinar la contraseña</p>

    <form class="login__form" novalidate>
      <label class="sr-only" for="pass">Contraseña</label>
      <div class="field">
        <input id="pass" type="password" placeholder="Contraseña"
               autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
        <button type="button" class="field__eye" aria-label="Mostrar contraseña" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="3"/>
            <path class="field__eye-off" d="M4 4l16 16"/>
          </svg>
        </button>
      </div>
      <button class="btn" type="submit">Abrir</button>
      <p class="login__msg" role="status" aria-live="polite"></p>
    </form>

    <button type="button" class="login__hint">¿querés una pista?</button>
  </main>
</body>
</html>
